<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>36TY — five concepts</title>
  <style>
    body { margin: 0; background: #0a0908; color: #ece6dc; font: 16px/1.45 Georgia, serif; }
    header { padding: 2.5rem 6vw 1rem; }
    h1 { font: 800 2.4rem/1 Syne, sans-serif; letter-spacing: -0.04em; }
    p { max-width: 62ch; opacity: 0.82; }
    .grid { display: grid; gap: 2rem; padding: 1rem 6vw 4rem; }
    figure { margin: 0; }
    img { width: 100%; height: auto; display: block; }
    figcaption { padding: 0.8rem 0 0; }
    .score { font: 600 12px/1.4 ui-monospace, monospace; letter-spacing: 0.08em; color: #c4a070; }
    .win { outline: 1px solid #e0b07a; padding: 1rem; }
  </style>
</head>
<body>
  <header>
    <h1>FIVE CONCEPTS. ONE 2-BUS.</h1>
    <p>Geographic biography retired. The brief is a world-class hip-hop/R&amp;B producer. Winner: <b>E — THE 2-BUS</b>. Signature mechanic: PLAY sums the mix. Projects are channel solos. Scroll is the arrangement.</p>
  </header>
  <div class="grid">
    <figure>
      <img src="concepts/concept-a-mix-position.webp" alt="Mix position" />
      <figcaption>
        <b>A — MIX POSITION</b> Seated at the desk. Intimate, buildable, slightly familiar as “studio website.” Originality 8.4 · Awwwards 8.6 · Signature 8.2
      </figcaption>
    </figure>
    <figure>
      <img src="concepts/concept-b-stereo-field.webp" alt="Stereo field" />
      <figcaption>
        <b>B — STEREO FIELD</b> Abstract L/R/depth mix. High art, weaker producer-craft read, harder to keep from becoming a visualizer. Originality 9.1 · Producer 7.8 · Signature 8.5
      </figcaption>
    </figure>
    <figure>
      <img src="concepts/concept-c-pad-grid.webp" alt="Pad grid" />
      <figcaption>
        <b>C — PAD GRID</b> 16 pads as navigation. Culturally right, gimmick risk, weak scroll. Originality 8.0 · Scroll 6.5 · Signature 8.0
      </figcaption>
    </figure>
    <figure>
      <img src="concepts/concept-d-afterlight.webp" alt="Afterlight film" />
      <figcaption>
        <b>D — AFTERLIGHT</b> Photography-first music video. Beautiful, but PLAY does not have a unique job. Originality 8.2 · Music 7.6 · Signature 7.9
      </figcaption>
    </figure>
    <figure class="win">
      <img src="concepts/concept-e-two-bus.webp" alt="The 2-bus" />
      <figcaption>
        <b>E — THE 2-BUS (WINNER)</b> The site is the master bus. Unsummed until PLAY. Channels solo into atmospheres. Mix-position camera (from A) is the body, not the idea.<br />
        <span class="score">ORIG 9.4 · ID 9.3 · PRODUCER 9.6 · MUSIC 9.7 · INTERACTION 9.4 · SCROLL 9.2 · TYPE 9.1 · ART 9.3 · NARRATIVE 9.2 · SIGNATURE 9.6 · PERF 9.2 · MOBILE 9.1 · AWWWARDS 9.4</span>
      </figcaption>
    </figure>
  </div>
</body>
</html>
